<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

<div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h4 class="mb-1 fw-bold">Nueva contraseña</h4>
    <p class="text-muted mb-4" style="font-size: 14px;">Escribe tu nueva contraseña para Agro-Hogar</p>

    <div class="mb-3">
        <div class="input-group">
            <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Nueva contraseña"
                    minlength="6"
            />
            <button class="btn btn-outline-secondary" type="button" onclick="toggleVer()">
                <span id="iconoOjo">👁</span>
            </button>
        </div>
    </div>

    <button id="btn" class="btn btn-success w-100" onclick="cambiar()">
        Cambiar contraseña
    </button>

    <div id="mensaje" class="mt-3"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="index.js"></script>
</body>
</html>
